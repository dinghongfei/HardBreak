<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="index.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HardBreak</title>
  <script src="/locales.js"></script>
  <script src="/sevenseg.js"></script>
    <script type="module" src="/index.js" defer></script>
</head>

<body>
  <div class="container">
    <div class="container-scaler">
      <!-- 一级提示 -->
      <h1 id="level-1-tip" class="level-1-tip">喝杯水吧</h1>
      <!-- 二级提示 -->
      <p id="level-2-tip" class="level-2-tip">补充水分，清醒头脑</p>

      <!-- 倒计时UI：圆环 -->
      <div class="countdown" id="countdown-ring">
        <!-- 背景圆环 -->
        <svg class="countdown-circle">
          <circle cx="112" cy="112" r="90" stroke="rgba(255,255,255,0.5)" stroke-width="8" fill="none" />
          <!-- 进度圆环 -->
          <circle cx="112" cy="112" r="90" stroke="#4ade80" stroke-width="8" fill="none"
            stroke-dasharray="565.4866776461628" stroke-dashoffset="0" stroke-linecap="round"
            class="countdown-circle-progress" />
        </svg>

        <!-- 时间文字 -->
        <div class="countdown-text-box">
          <span class="countdown-text-box-time">
            <span class="time-minutes">00</span><span class="time-colon">:</span><span class="time-seconds">00</span>
          </span>
          <span class="countdown-text-box-label" data-translate="break.countdown.label">剩余时间</span>
        </div>
      </div>

      <!-- 倒计时UI：翻页时钟 -->
      <div class="flipclock" id="countdown-flipclock" style="display: none;">
        <div class="flipclock-cards">
          <div class="flip-digit" id="flip-m1" data-value="0">
            <div class="flip-half flip-top"><span>0</span></div>
            <div class="flip-half flip-bottom"><span>0</span></div>
          </div>
          <div class="flip-digit" id="flip-m2" data-value="0">
            <div class="flip-half flip-top"><span>0</span></div>
            <div class="flip-half flip-bottom"><span>0</span></div>
          </div>
          <div class="flip-colon"><span></span><span></span></div>
          <div class="flip-digit" id="flip-s1" data-value="0">
            <div class="flip-half flip-top"><span>0</span></div>
            <div class="flip-half flip-bottom"><span>0</span></div>
          </div>
          <div class="flip-digit" id="flip-s2" data-value="0">
            <div class="flip-half flip-top"><span>0</span></div>
            <div class="flip-half flip-bottom"><span>0</span></div>
          </div>
        </div>
        <span class="countdown-text-box-label" data-translate="break.countdown.label">剩余时间</span>
      </div>

      <!-- 倒计时UI：数码管（数字 SVG 由 sevenseg.js 构建） -->
      <div class="sevenseg" id="countdown-sevenseg" style="display: none;">
        <div class="sevenseg-digits" id="sevenseg-digits"></div>
        <span class="countdown-text-box-label" data-translate="break.countdown.label">剩余时间</span>
      </div>

      <!-- 倒计时UI：大字数字（进度条由 index.js 逐帧驱动） -->
      <div class="digits" id="countdown-digits" style="display: none;">
        <span class="digits-time">
          <span class="digits-minutes">00</span><span class="time-colon">:</span><span class="digits-seconds">00</span>
        </span>
        <div class="digits-progress">
          <div class="digits-progress-fill" id="digits-progress-fill"></div>
        </div>
        <span class="countdown-text-box-label" data-translate="break.countdown.label">剩余时间</span>
      </div>

      <!-- 倒计时UI：呼吸圆（呼吸动画是纯 CSS，整体尺寸由 index.js 按进度缩放） -->
      <div class="breath" id="countdown-breath" style="display: none;">
        <div class="breath-visual">
          <div class="breath-shrink" id="breath-shrink">
            <div class="breath-circle"></div>
            <div class="breath-halo"></div>
          </div>
          <span class="breath-time">
            <span class="breath-minutes">00</span><span class="time-colon">:</span><span class="breath-seconds">00</span>
          </span>
        </div>
        <span class="countdown-text-box-label" data-translate="break.countdown.label">剩余时间</span>
      </div>

      <!-- 休息提示 -->
      <!-- <div class="rest-text-box">
        👀 看看远处，让眼睛放松一下
      </div> -->

      <!-- 不可跳过模式提示 -->
      <div id="lock-tip" class="lock-tip" style="display: none;">
        <span>&#128274;</span>
        <span data-translate="break.lock.tip">
          不可跳过模式已开启
        </span>
      </div>

      <!-- 跳过按钮  <span>&#9197;</span> -->
      <button id="skip-btn" class="skip-btn is-cjk" data-translate="break.skip.btn">
        跳过
      </button>
    </div>
  </div>

</body>

</html>
