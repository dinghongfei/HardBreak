<!-- src/config.html -->
<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="config.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>应用配置</title>
    <script type="module" src="/config.js" defer></script>
</head>

<body>
    <div class="config-container">
        <!-- 标签头 -->
        <div class="tab-header">
            <nav class="tab-nav">
                <button class="tab-btn active" data-tab="general" data-translate="config.tab.general">常规</button>
                <button class="tab-btn" data-tab="break-window" data-translate="config.tab.breakWindow">休息窗</button>
                <button class="tab-btn" data-tab="about" data-translate="config.tab.about">关于</button>
            </nav>
        </div>

        <!-- 常规设置 -->
        <div class="tab-content active" id="general">

            <div class="status-card">
                <div class="status-row">
                    <div class="status-left">
                        <!-- 呼吸灯 -->
                        <div class="breathing-light">
                            <div class="breathing-dot"></div>
                            <div class="breathing-ring"></div>
                        </div>
                        <div>
                            <h4 class="status-title" data-translate="config.tab.general.status.title">运行中</h4>
                            <p id="status-subtitle" class="status-subtitle">
                                当前正在工作
                            </p>
                        </div>
                    </div>
                    <div class="status-right">
                        <p id="status-label" class="status-label">
                            距离下一次休息倒计时
                        </p>
                        <p id="status-number" class="status-number">
                            02:00
                        </p>
                    </div>
                </div>
            </div>


            <!-- 工作时长滑块 -->
            <div class="slider-container">
                <div class="slider-header">
                    <div class="slider-label">
                        <span class="setting-icon">🐴</span>
                        <span data-translate="config.tab.general.work.label">工作时长</span>
                    </div>
                    <span class="slider-value">
                        <span id="workDurationValue">25</span>
                        <span data-translate="config.tab.general.work.unit">分钟</span>
                    </span>
                </div>
                <div class="slider-track" id="workSliderTrack">
                    <div class="slider-fill blue" id="workSliderFill"></div>
                    <div class="slider-thumb" id="workThumb"></div>
                </div>
            </div>

            <!-- 休息时长滑块 -->
            <div class="slider-container">
                <div class="slider-header">
                    <div class="slider-label">
                        <span class="setting-icon">🚴‍♂️</span>
                        <span data-translate="config.tab.general.break.label">休息时长</span>
                    </div>
                    <span class="slider-value">
                        <span id="breakDurationValue">5</span>
                        <span data-translate="config.tab.general.break.unit">分钟</span>

                    </span>
                </div>
                <div class="slider-track" id="breakSliderTrack">
                    <div class="slider-fill green" id="breakSliderFill"></div>
                    <div class="slider-thumb green" id="breakThumb"></div>
                </div>
            </div>

            <!-- 时长立即生效按钮 -->
            <div class="apply-now-container">
                <button class="apply-now-btn" id="applyNowBtn" data-translate="config.tab.general.applyNow.btn">立即生效</button>
                <p class="apply-now-tip" data-translate="config.tab.general.applyNow.tip">工作/休息时长默认从下一阶段开始生效。点击后立即按新时长从工作阶段重新计时，效果等同重启应用。</p>
            </div>

            <!-- 时间到提醒 -->
            <div class="setting-item">
                <div class="setting-label-box">
                    <div class="setting-label">
                        <span class="setting-icon">🔔</span>
                        <span class="setting-text" data-translate="config.tab.general.notify.label">进入休息前提醒</span>
                    </div>
                    <p class="setting-label-tip" data-translate="config.tab.general.notify.tip">开启后，休息前10秒弹窗提醒</p>

                </div>
                <div class="toggle-switch on" id="notifyToggle">
                    <div class="toggle-knob"></div>
                </div>
            </div>

            <!-- 不可跳过休息模式 -->
            <div class="setting-item">
                <div class="setting-label-box">
                    <div class="setting-label">
                        <span class="setting-icon">🔒</span>
                        <span class="setting-text" data-translate="config.tab.general.noSkip.label">不可跳过模式</span>
                    </div>
                    <p class="setting-label-tip" data-translate="config.tab.general.noSkip.tip">开启后，休息不可跳过</p>
                </div>
                <div class="toggle-switch" id="noSkipToggle">
                    <div class="toggle-knob"></div>
                </div>
            </div>

            <!-- 语言设置 -->
            <div class="setting-item">
                <div class="setting-label">
                    <span class="setting-icon">🌐</span>
                    <span class="setting-text" data-translate="config.tab.general.language.label">语言</span>
                </div>
                <div class="select-wrapper">
                    <select class="custom-select" id="language-select">
                        <option value="zh-CN">简体中文</option>
                        <option value="zh-TW">繁体中文</option>
                        <option value="en">English</option>
                    </select>
                    <span class="select-arrow">▼</span>
                </div>
            </div>
        </div>

        <!-- 休息窗设置：倒计时样式（后续支持提示语） -->
        <div class="tab-content" id="break-window">
            <div class="countdown-mode-list">
                <div class="countdown-mode-card" data-mode="ring">
                    <div class="mode-preview">
                        <!-- 与休息窗一致：深色底衬、半透明白轨道、绿色进度弧、中央时间 -->
                        <div class="mini-ring">
                            <svg viewBox="0 0 48 48" class="mini-ring-svg">
                                <circle cx="24" cy="24" r="19" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2" />
                                <circle cx="24" cy="24" r="19" fill="none" stroke="#4ade80" stroke-width="2"
                                    stroke-dasharray="119.381" stroke-dashoffset="30" stroke-linecap="round"
                                    transform="rotate(-90 24 24)" />
                            </svg>
                            <span class="mini-ring-time">05:00</span>
                        </div>
                    </div>
                    <span class="mode-name" data-translate="config.tab.breakWindow.mode.ring">圆环</span>
                </div>
                <div class="countdown-mode-card" data-mode="flipclock">
                    <div class="mode-preview mode-preview-flip">
                        <div class="mini-flip-card"><span>0</span></div>
                        <div class="mini-flip-card"><span>5</span></div>
                        <div class="mini-flip-colon"><span></span><span></span></div>
                        <div class="mini-flip-card"><span>0</span></div>
                        <div class="mini-flip-card"><span>0</span></div>
                    </div>
                    <span class="mode-name" data-translate="config.tab.breakWindow.mode.flipclock">翻页时钟</span>
                </div>
            </div>
            <p class="countdown-mode-tip" data-translate="config.tab.breakWindow.tip">选择休息窗的倒计时样式，切换后立即生效。</p>
        </div>

        <!-- 关于页面 -->
        <div class="tab-content" id="about">
            <div class="setting-item">
                <div class="setting-label">
                    <span class="setting-text" data-translate="config.tab.about.version.label">版本</span>
                </div>
                <span id="app-version" class="setting-value">0.1.0</span>
            </div>
            <div class="setting-item">
                <div class="setting-label">
                    <span class="setting-text" data-translate="config.tab.about.description.label">描述</span>
                </div>
                <span class="setting-value" data-translate="config.tab.about.description.text">
                    一款帮助你养成良好工作休息习惯的应用，定时提醒你休息，保护你的健康。
                </span>
            </div>
        </div>
    </div>


</body>

</html>
